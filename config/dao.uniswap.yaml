# DAO configuration. Swapping this file (plus its labels file) is all it takes
# to point the pipeline at another DAO. Every address carries a source URL.
dao:
  id: uniswap
  name: Uniswap DAO

chain:
  chain_id: 1
  name: Ethereum mainnet
  explorer_tx_url: https://etherscan.io/tx/{tx_hash}
  explorer_address_url: https://etherscan.io/address/{address}
  native_symbol: ETH
  native_decimals: 18

# Addresses the agent is allowed to analyze. Requests about any other address are refused.
treasury_addresses:
  - address: "0x1a9C8182C09F50C8318d769245beA52c32BE35BC"
    name: Uniswap Governance Timelock (treasury)
    source: https://docs.uniswap.org/concepts/governance/overview
    note: >-
      Listed as "Timelock" under Active Governance Contracts in
      https://github.com/Uniswap/docs/blob/main/content/ecosystem/governance/technical-reference.mdx
      and linked as "the treasury" in the governance overview.

snapshot:
  # Full history up to the pinned end. The end block is resolved once from end_timestamp
  # and recorded in fixtures/snapshot.json so every later run uses the same block.
  start_block: 0
  end_timestamp: "2026-06-30T23:59:59Z"

# Only tokens listed here count toward totals. Anything else the treasury received
# (airdropped spam, symbol look-alikes) is stored but flagged unverified.
# Tokens are matched by contract address, never by symbol.
tokens:
  - address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984"
    symbol: UNI
    decimals: 18
    price_id: coingecko:uniswap
    source: https://github.com/Uniswap/docs/blob/main/content/ecosystem/governance/technical-reference.mdx
  - address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    symbol: USDC
    decimals: 6
    price_id: coingecko:usd-coin
    source: https://developers.circle.com/stablecoins/usdc-contract-addresses
  - address: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
    symbol: USDT
    decimals: 6
    price_id: coingecko:tether
    source: https://tether.to/en/supported-protocols
native_price_id: coingecko:ethereum

labels_file: config/labels.uniswap.yaml
